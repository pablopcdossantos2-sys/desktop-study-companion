[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "desktop-study-companion"
version = "0.1.0-dev20"
description = "Desktop companion for study accountability and focus."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
  { name = "Desktop Study Companion contributors" }
]
dependencies = [
  "psutil>=6.0,<8",
  "PySide6>=6.8,<7",
  "pywin32>=306; platform_system == 'Windows'",
  "numpy>=1.26,<3",
  "sounddevice>=0.5.6,<0.6",
  "faster-whisper>=1.2.1,<2",
  "av>=14,<19",
  "piper-tts>=1.8,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10"
]

[project.scripts]
desktop-study-companion = "desktop_study_companion.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_study_companion"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "desktop_study_companion/_resources/config"
"docs" = "desktop_study_companion/_resources/docs"
"assets/avatar" = "desktop_study_companion/_resources/assets/avatar"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
