name: build-windows-portable

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "avatar_web/**"
      - "README.md"
      - "docs/**"
      - "config/**"
      - "assets/avatar/**"
      - "scripts/fetch-avatar.ps1"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: avatar_web/package-lock.json


      - name: Install project and builder
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "pyinstaller>=6.10,<7"

      - name: Fetch standalone Piper Windows runtime
        shell: pwsh
        run: |
          $url = "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip"
          $zip = Join-Path $env:RUNNER_TEMP "piper_windows_amd64.zip"
          $extract = "build/piper-runtime-extract"
          $target = "build/piper-runtime"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $expectedZipHash = "f3c58906402b24f3a96d92145f58acba6d86c9b5db896d207f78dc80811efcea"
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "PIPER_WINDOWS_AMD64_ZIP_SHA256=$zipHash"
          if ($zipHash -ne $expectedZipHash) {
            throw "Standalone Piper archive SHA-256 mismatch. Expected $expectedZipHash but received $zipHash."
          }
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $exe = Get-ChildItem $extract -Filter "piper.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Standalone Piper piper.exe was not found." }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item (Join-Path $exe.Directory.FullName "*") $target -Recurse -Force
          if (-not (Test-Path "$target/piper.exe")) { throw "Standalone Piper executable was not staged." }
          if (-not (Test-Path "$target/espeak-ng-data/phontab")) { throw "Standalone Piper espeak-ng-data/phontab was not staged." }
          Get-FileHash "$target/piper.exe" -Algorithm SHA256

      - name: Smoke test standalone Piper synthesis
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build/piper-smoke" | Out-Null
          @'
          from pathlib import Path
          from piper.download_voices import download_voice
          download_voice("pt_BR-edresson-low", Path("build/piper-smoke"))
          '@ | python -
          $model = "build/piper-smoke/pt_BR-edresson-low.onnx"
          $config = "build/piper-smoke/pt_BR-edresson-low.onnx.json"
          $output = "build/piper-smoke/smoke.wav"
          "Teste da voz Piper." | & "build/piper-runtime/piper.exe" --model $model --config $config --espeak_data "build/piper-runtime/espeak-ng-data" --output_file $output
          if ($LASTEXITCODE -ne 0) { throw "Standalone Piper synthesis returned exit code $LASTEXITCODE." }
          if (-not (Test-Path $output)) { throw "Standalone Piper did not create the smoke-test WAV." }
          if ((Get-Item $output).Length -le 44) { throw "Standalone Piper created an empty smoke-test WAV." }
          Write-Host "Standalone Piper smoke WAV bytes=$((Get-Item $output).Length)"

      - name: Fetch verified CC0 avatar
        shell: pwsh
        run: ./scripts/fetch-avatar.ps1

      - name: Validate VRM structure and capabilities
        run: python -m desktop_study_companion.avatar.validate_model assets/avatar/Sendagaya_Shino.vrm


      - name: Build VRM renderer
        shell: pwsh
        run: |
          Set-Location avatar_web
          npm ci
          npm run build

      - name: Verify packaged avatar renderer is current
        shell: pwsh
        run: git diff --no-index --exit-code -- "avatar_web/dist" "src/desktop_study_companion/_resources/avatar/renderer"

      - name: Run source compile check
        run: python -m compileall -q src

      - name: Run test suite before packaging
        run: python -m pytest -q

      - name: Build portable application
        shell: pwsh
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name DesktopStudyCompanion
          --paths src
          --collect-submodules win32com
          --hidden-import pythoncom
          --hidden-import pywintypes
          --hidden-import PySide6.QtWebEngineWidgets
          --hidden-import PySide6.QtWebEngineCore
          --collect-all sounddevice
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all av
          --collect-all piper
          src/desktop_study_companion/app.py

      - name: Add editable configuration and docs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/DesktopStudyCompanion/config" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/DesktopStudyCompanion/docs" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/DesktopStudyCompanion/avatar/renderer" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/DesktopStudyCompanion/assets/avatar" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/DesktopStudyCompanion/piper-runtime" | Out-Null
          Copy-Item "config/default.json" "dist/DesktopStudyCompanion/config/default.json"
          Copy-Item "avatar_web/dist/*" "dist/DesktopStudyCompanion/avatar/renderer/" -Recurse -Force
          Copy-Item "assets/avatar/Sendagaya_Shino.vrm" "dist/DesktopStudyCompanion/assets/avatar/Sendagaya_Shino.vrm"
          Copy-Item "assets/avatar/README.md" "dist/DesktopStudyCompanion/assets/avatar/README.md"
          Copy-Item "assets/avatar/avatar-manifest.json" "dist/DesktopStudyCompanion/assets/avatar/avatar-manifest.json"
          Copy-Item "build/piper-runtime/*" "dist/DesktopStudyCompanion/piper-runtime/" -Recurse -Force
          Copy-Item "README.md" "dist/DesktopStudyCompanion/README.md"
          Copy-Item "THIRD-PARTY-NOTICES.md" "dist/DesktopStudyCompanion/THIRD-PARTY-NOTICES.md"
          Copy-Item "avatar_web/THIRD_PARTY_LICENSES.md" "dist/DesktopStudyCompanion/THIRD_PARTY_LICENSES-AVATAR.md"
          Copy-Item "docs/TUTORIAL-INSTALACAO-WINDOWS.md" "dist/DesktopStudyCompanion/docs/TUTORIAL-INSTALACAO-WINDOWS.md"
          Copy-Item "docs/DESKTOP-INTERVENTIONS.md" "dist/DesktopStudyCompanion/docs/DESKTOP-INTERVENTIONS.md"
          Copy-Item "docs/BEHAVIORAL-MEMORY.md" "dist/DesktopStudyCompanion/docs/BEHAVIORAL-MEMORY.md"
          Copy-Item "docs/ACCOUNTABILITY.md" "dist/DesktopStudyCompanion/docs/ACCOUNTABILITY.md"
          Copy-Item "docs/AVATAR-VRM.md" "dist/DesktopStudyCompanion/docs/AVATAR-VRM.md"
          Copy-Item "docs/CONVERSATIONAL-BRAIN.md" "dist/DesktopStudyCompanion/docs/CONVERSATIONAL-BRAIN.md"
          Copy-Item "docs/TUTORIAL-CEREBRO-LOCAL-OLLAMA.md" "dist/DesktopStudyCompanion/docs/TUTORIAL-CEREBRO-LOCAL-OLLAMA.md"
          Copy-Item "docs/VOICE-CONVERSATION.md" "dist/DesktopStudyCompanion/docs/VOICE-CONVERSATION.md"
          Copy-Item "docs/TUTORIAL-PIPER.md" "dist/DesktopStudyCompanion/docs/TUTORIAL-PIPER.md"
          Copy-Item "docs/PROACTIVITY.md" "dist/DesktopStudyCompanion/docs/PROACTIVITY.md"
          Copy-Item "docs/COACH-MODE.md" "dist/DesktopStudyCompanion/docs/COACH-MODE.md"
          Copy-Item "docs/DIAGNOSTICS.md" "dist/DesktopStudyCompanion/docs/DIAGNOSTICS.md"
          Copy-Item "docs/THIRD_PARTY_LICENSES-VOICE.md" "dist/DesktopStudyCompanion/THIRD_PARTY_LICENSES-VOICE.md"

      - name: Smoke test packaged executable presence
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/DesktopStudyCompanion/DesktopStudyCompanion.exe")) {
            throw "DesktopStudyCompanion.exe was not generated."
          }
          if (-not (Test-Path "dist/DesktopStudyCompanion/config/default.json")) {
            throw "Portable config/default.json was not packaged."
          }
          if (-not (Test-Path "dist/DesktopStudyCompanion/avatar/renderer/index.html")) {
            throw "VRM renderer was not packaged."
          }
          if (-not (Test-Path "dist/DesktopStudyCompanion/assets/avatar/Sendagaya_Shino.vrm")) {
            throw "Sendagaya_Shino.vrm was not packaged."
          }
          if (-not (Test-Path "dist/DesktopStudyCompanion/piper-runtime/piper.exe")) {
            throw "Standalone Piper runtime was not packaged."
          }
          if (-not (Test-Path "dist/DesktopStudyCompanion/piper-runtime/espeak-ng-data/phontab")) {
            throw "Standalone Piper espeak-ng-data was not packaged."
          }

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/DesktopStudyCompanion/*" -DestinationPath "DesktopStudyCompanion-Windows-Portable.zip" -Force

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopStudyCompanion-Windows-Portable
          path: DesktopStudyCompanion-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 90