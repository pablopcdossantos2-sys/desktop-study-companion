name: tests

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile source
        run: python -m compileall -q src

      - name: Run tests
        run: python -m pytest -q

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir wheelhouse

      - name: Verify wheel resources
        shell: pwsh
        run: |
          @'
          import glob
          import zipfile

          wheel = glob.glob("wheelhouse/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())

          required = {
              "desktop_study_companion/_resources/config/default.json",
              "desktop_study_companion/_resources/docs/TUTORIAL-INSTALACAO-WINDOWS.md",
              "desktop_study_companion/_resources/assets/avatar/avatar-manifest.json",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit("Wheel is missing runtime resources: " + ", ".join(missing))
          print("Wheel runtime resources verified.")
          '@ | python -


  avatar-web:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: avatar_web/package.json

      - name: Install avatar dependencies
        working-directory: avatar_web
        run: npm install

      - name: Build avatar renderer
        working-directory: avatar_web
        run: npm run build
